spring:
  config:
    import: optional:file:.env # 🔥 VERY IMPORTANT

  application:
    name: gitten-backend

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI}

    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      username: ${SPRING_DATA_REDIS_USERNAME:default}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD} # App Password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 15000
          timeout: 15000
          writetimeout: 15000

  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expiration: 315360000000 # 10 years in ms (frontend handles 30 day inactivity)
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: read:user,repo

  main:
    allow-bean-definition-overriding: true

admin:
  initial:
    email: ${ADMIN_INITIAL_EMAIL}

logging:
  level:
    com.gitten: DEBUG
    org.springframework.security: DEBUG

openai:
  api:
    key: ${OPENAI_API_KEY}

frontend:
  url: ${FRONTEND_URL:https://gittenz.vercel.app}

server:
  port: ${PORT:8080}
